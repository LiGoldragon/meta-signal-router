[package]
name         = "meta-signal-router"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.85"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/meta-signal-router"
description  = "Meta Signal contract for the PersonaRouter meta-policy channel surface."
publish      = false
links        = "meta-signal-router"
build        = "build.rs"

[lib]
name = "meta_signal_router"
path = "src/lib.rs"

[features]
default   = []
nota-text = ["dep:nota-next"]

[dependencies]
nota-codec = { git = "https://github.com/LiGoldragon/nota-codec.git", branch = "main" }
nota-next  = { git = "https://github.com/LiGoldragon/nota-next.git", branch = "main", optional = true }
rkyv       = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }

[build-dependencies]
schema-rust-next = { git = "https://github.com/LiGoldragon/schema-rust-next.git", branch = "main" }

[dev-dependencies]
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
